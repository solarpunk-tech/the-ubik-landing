[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.0"

[[headers]]
  for = "/downloads/*.exe"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"

[[headers]]
  for = "/downloads/*.dmg"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Content-Disposition = "attachment"

[build.processing]
  skip_processing = true

[[redirects]]
  from = "/terms"
  to = "/terms-of-service"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy"
  status = 301

# A malformed link somewhere (markdown with the closing paren swallowed into
# the URL) sent ~44 visits in 90 days to the homepage instead of the policy.
[[redirects]]
  from = "/privacy-policy)"
  to = "/legal/privacy"
  status = 301

[[redirects]]
  from = "/ubik-workspace-admin-guide.html"
  to = "/google-workspace-admin-guide"
  status = 301

# Paths from the workbook's proposed sitemap that live under existing URLs,
# so a link written from that plan still lands on the right page.
[[redirects]]
  from = "/learn"
  to = "/platform"
  status = 301

[[redirects]]
  from = "/how-it-works"
  to = "/platform"
  status = 301

[[redirects]]
  from = "/trade-notes"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/guide"
  to = "https://docs.theubik.com"
  status = 302
  force = true

[[redirects]]
  from = "/try"
  to = "https://app.theubik.com"
  status = 302
  force = true

# Prerendered routes are served from their own dist/<route>/index.html (files
# win over this rule). Everything else gets the bare shell, not the
# prerendered homepage, so an unknown path never shows homepage copy under
# its own URL.
[[redirects]]
  from = "/workflows/order-promises"
  to = "/workflows/production-planning"
  status = 301

[[redirects]]
  from = "/*"
  to = "/spa.html"
  status = 200
