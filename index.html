    <script>
      // Apply the theme before first paint so there is no light flash on a
      // dark-mode load. Mirrors resolveInitialTheme() in ThemeToggle.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("ubik-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* storage blocked — stay on the light default */
        }
      })();
    </script>
