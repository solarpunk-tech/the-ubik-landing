# Secret scanning (F-415).
#
# Runs the gitleaks CLI over the commits a PR or a push adds, and fails when it
# finds a secret. Findings are printed with --redact, so no secret value ever
# reaches the job log.
#
# Why the CLI and not gitleaks/gitleaks-action: the action needs a paid licence
# for organisation repos. The CLI is MIT and needs nothing.
#
# The binary is pinned to one release and its SHA-256 is checked against the
# value below (copied from the release's gitleaks_<ver>_checksums.txt). To
# upgrade, change both lines together.
#
# Rules: gitleaks' default rule set plus .gitleaks.toml at the repo root.
# A false positive goes into .gitleaks.toml's allowlist with a comment saying
# why it is not a secret. A real secret must be rotated, not allowlisted.
#
# Run the same scan locally:
#   gitleaks git --redact --config .gitleaks.toml --log-opts="origin/main..HEAD" .

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history, so the commit range resolves)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Every commit on the PR branch that the base branch does not have.
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # The commits this push added.
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # New branch, or a force-push whose old tip is gone: scan the pushed commit.
            range="-1 ${PUSH_AFTER}"
          fi
          echo "Scanning commit range: ${range}"
          config_args=()
          if [ -f .gitleaks.toml ]; then config_args=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks" git . \
            "${config_args[@]}" \
            --log-opts="${range}" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 || {
              echo "::error title=Secret found::gitleaks found a secret in ${range}. Remove it from the branch history and rotate it if it was ever real. If it is a false positive, add an allowlist entry with a reason to .gitleaks.toml."
              exit 1
            }
