name: Translate locales

# English copy lands on main -> es/pt/nl are refreshed and proposed as a PR.
# The weekly run is a backstop for anything a failed run left stale.
on:
  push:
    branches:
      - main
    paths:
      - src/locales/en/**
      - scripts/translate-locales.mjs
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate-locales
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Translate stale strings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-locales.mjs

      # Translations are reviewed like any other copy change: the Netlify
      # deploy preview on this PR is where a native speaker checks them.
      - name: Open or update the translation PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/translations
          delete-branch: true
          add-paths: src/locales/**
          commit-message: "chore(i18n): refresh es, pt and nl translations"
          title: "chore(i18n): refresh es, pt and nl translations"
          body: |
            Strings whose English source changed since they were last translated, regenerated by `scripts/translate-locales.mjs`.

            Review in the Netlify deploy preview. Product names, codes and figures are meant to stay in English; flag anything else that reads wrong.
          labels: i18n
