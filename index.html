<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Ubik gives specialist agents the memory, models, and tools to reason across tradeoffs and execute work for perishable-trade teams."

    <meta name="application-name" content="Ubik" />
    <meta name="keywords" content="AI for frozen food, perishable supply chain AI, frozen food ERP automation, RFQ to quote AI, personalised workspace, vertical AI, decision intelligence supply chain, frozen food importer software, AI workspace frozen food, AI agents trade operations" />
    <meta name="author" content="Solarpunk Technology" />
    <meta property="og:title" content="Ubik | Agentic operating system for perishable trade" />
    <meta
      property="og:description"
      content="Turn scattered trade signals into reviewed decisions your team can approve, trace, and reuse."
    />
    <!-- Absolute URLs: the OG spec requires them, and several scrapers will not
         resolve a root-relative path. Width/height let a card reserve the right
         box before the image loads. Bump ?v= when the artwork changes so
         WhatsApp/LinkedIn/Slack drop their cached copy. -->
    <meta property="og:image" content="https://theubik.com/og-image.png?v=2" />
    <meta property="og:image:secure_url" content="https://theubik.com/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ubik: trade decisions, together. An agentic operating system for perishable trade." />
    <meta property="og:site_name" content="Ubik" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ubik | Agentic operating system for perishable trade" />
    <meta name="twitter:description" content="Turn scattered trade signals into reviewed decisions your team can approve, trace, and reuse." />
    <meta name="twitter:image" content="https://theubik.com/og-image.png?v=2" />
    <meta name="twitter:image:alt" content="Ubik: trade decisions, together. An agentic operating system for perishable trade." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theubik.com/" />
    <link rel="canonical" href="https://theubik.com/" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" />
    <script>
      // Apply the theme before first paint so there is no light flash on a
      // dark-mode load. Mirrors resolveInitialTheme() in ThemeToggle.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("ubik-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* storage blocked — stay on the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
