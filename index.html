<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="ubik is an AI-native platform for cross-border trade. Its agents read email, WhatsApp, the ERP and documents, work order changes and exceptions through under your rules, and show every decision."
    />
    <meta name="application-name" content="Ubik" />
    <meta name="keywords" content="AI for cross-border trade, AI for importers and exporters, trade operations AI, order change automation, supplier follow-up automation, shipment document verification, AI agents for ERP, WhatsApp order management" />
    <meta name="author" content="Solarpunk Tech Inc." />
    <meta property="og:title" content="ubik | AI-native platform for cross-border trade" />
    <meta
      property="og:description"
      content="ubik is an AI-native platform for cross-border trade. Its agents read email, WhatsApp, the ERP and documents, work order changes and exceptions through under your rules, and show every decision."
    />
    <!-- Absolute URLs: the OG spec requires them, and several scrapers will not
         resolve a root-relative path. Width/height let a card reserve the right
         box before the image loads. Bump ?v= when the artwork changes so
         WhatsApp/LinkedIn/Slack drop their cached copy. -->
    <meta property="og:image" content="https://theubik.com/og-image.jpg?v=4" />
    <meta property="og:image:secure_url" content="https://theubik.com/og-image.jpg?v=4" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ubik: decision-making engine for importers and exporters, reading email, conversations and the ERP. An engraving of a harbour quay piled with seafood, dairy, soy, grain and fruit beside a cargo ship." />
    <!-- The moving version of the same card, for the scrapers that play
         og:video (Facebook, LinkedIn, some Discord/Telegram clients). Everyone
         else falls back to og:image, which is its last frame. -->
    <meta property="og:video" content="https://theubik.com/og-video.mp4?v=2" />
    <meta property="og:video:secure_url" content="https://theubik.com/og-video.mp4?v=2" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta property="og:site_name" content="ubik" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ubik | AI-native platform for cross-border trade" />
    <meta name="twitter:description" content="ubik is an AI-native platform for cross-border trade. Its agents read email, WhatsApp, the ERP and documents, work order changes and exceptions through under your rules, and show every decision." />
    <meta name="twitter:image" content="https://theubik.com/og-image.jpg?v=4" />
    <meta name="twitter:image:alt" content="ubik: decision-making engine for importers and exporters, reading email, conversations and the ERP. An engraving of a harbour quay piled with seafood, dairy, soy, grain and fruit beside a cargo ship." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theubik.com/" />
    <link rel="canonical" href="https://theubik.com/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10182B" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint so there is no light flash on a
      // dark-mode load. Mirrors resolveInitialTheme() in ThemeToggle.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("ubik-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* storage blocked — stay on the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
